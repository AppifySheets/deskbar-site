# Builds the feature docs pages (site/docs/) from docs/features in Deskbar's latest release.
#
# Used by pages.yml (before the upload) and by both jobs in check.yml (before validating and
# link-checking). It is a composite action, not a reusable workflow, because each job runs on
# its own runner and needs the built pages in its own checkout. The calling job must have
# checked out this repository first.
#
# Fails when the latest release has no docs/features, when a clip a page names is missing
# from site/media, or when the builder's tests fail. Callers let that fail the run.

name: Build feature docs
description: Fetch Deskbar's docs/features at its latest release tag and render them into site/docs.

runs:
  using: composite
  steps:
    # Which Deskbar release the pages describe: its latest GitHub release tag. The token lets
    # gh read the public repo without the anonymous rate limit. The tag is assigned before
    # it is written to the output, because a pipeline's exit status would hide a gh failure.
    - name: Find Deskbar's latest release tag
      id: tag
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag=$(gh release view --repo AppifySheets/Deskbar --json tagName -q .tagName)
        test -n "$tag" || { echo "::error::Could not find Deskbar's latest release"; exit 1; }
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    # Fetch only docs/features at that tag: a shallow, blob-less, sparse clone, so none of
    # the app's source is downloaded.
    - name: Fetch Deskbar's feature docs at that tag
      shell: bash
      env:
        TAG: ${{ steps.tag.outputs.tag }}
      run: |
        git clone --depth 1 --branch "$TAG" --filter=blob:none --sparse https://github.com/AppifySheets/Deskbar deskbar
        git -C deskbar sparse-checkout set docs/features
        # A release that predates the feature docs would otherwise fail later with a
        # confusing "no pages" error; say plainly which tag is missing them.
        test -d deskbar/docs/features || { echo "::error::Deskbar $TAG has no docs/features yet; the feature pages land with Deskbar PR #415"; exit 1; }

    # Node runs the page builder (tools/build-docs).
    - uses: actions/setup-node@v7
      with:
        node-version: 22

    # Install the builder's one dependency (marked) exactly as locked in package-lock.json.
    - name: Install the docs builder
      shell: bash
      working-directory: tools/build-docs
      run: npm ci

    # The builder's own tests. They run before the build so a broken builder fails here, with
    # its own message, instead of producing odd pages.
    - name: Test the docs builder
      shell: bash
      working-directory: tools/build-docs
      run: npm test

    # Render the markdown into site/docs/. --media is where the builder looks for the clips
    # the pages name; a missing clip fails the build. --tag is shown on the pages as the
    # release they describe.
    - name: Build the docs pages
      shell: bash
      env:
        TAG: ${{ steps.tag.outputs.tag }}
      run: node tools/build-docs/build.mjs --docs deskbar/docs/features --out site/docs --media site/media --tag "$TAG"
