# Checks for deskbar.app. Runs on every pull request, and again on main after a merge, so a
# link that broke between the pull request and the merge still shows up.
#
# What it guards against:
#   html  - broken or non-standard markup, missing alt text, bad nesting, invalid
#           attributes, via html-validate with its "recommended" rules (.htmlvalidate.json).
#   links - links that go nowhere: a renamed page, a missing image, a #fragment with no
#           matching id, or a GitHub URL that moved. Uses lychee (lychee.toml).
#
# Nothing here deploys anything, but both jobs first build the feature docs (site/docs/)
# from the latest Deskbar release, so those pages are validated and link-checked too.
# pages.yml publishes the site to GitHub Pages after a merge (see docs/hosting.md). These two jobs are the
# gate a pull request has to pass before it is merged.

name: Check site

on:
  pull_request:
  push:
    branches: [main]
  # Allows running the checks by hand from the Actions tab, e.g. to re-test external links.
  workflow_dispatch:

# Read-only token: the jobs only read the repository and fetch public URLs.
permissions:
  contents: read

# A new push to the same pull request cancels the run still going for the previous one.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html:
    name: Validate HTML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Get the pull request's files.
      - uses: actions/checkout@v7

      # ---- Build the feature docs (site/docs/) from the Deskbar repo ----
      # Both check jobs need the built pages in site/docs/, and each job has its own runner, so
      # each builds them. Same steps in pages.yml; keep them in sync.
      # Which Deskbar release the pages describe: its latest GitHub release tag. The token lets gh
      # read the public repo without the anonymous rate limit.
      - name: Find Deskbar's latest release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo AppifySheets/Deskbar --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"

      # Fetch only docs/features at that tag: a shallow, blob-less, sparse clone, so none of the
      # app's source is downloaded.
      - name: Fetch Deskbar's feature docs at that tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git clone --depth 1 --branch "$TAG" --filter=blob:none --sparse https://github.com/AppifySheets/Deskbar deskbar
          git -C deskbar sparse-checkout set docs/features
          # A release that predates the feature docs would otherwise fail later with a confusing
          # "no pages" error; say plainly which tag is missing them.
          test -d deskbar/docs/features || { echo "::error::Deskbar $TAG has no docs/features yet; the feature pages land with Deskbar PR #415"; exit 1; }

      # Node runs the page builder (tools/build-docs). Version matches the html-validate setup.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Install the builder's one dependency (marked) exactly as locked in package-lock.json.
      - name: Install the docs builder
        working-directory: tools/build-docs
        run: npm ci

      # The builder's own tests. They run before the build so a broken builder fails here, with
      # its own message, instead of producing odd pages.
      - name: Test the docs builder
        working-directory: tools/build-docs
        run: npm test

      # Render the markdown into site/docs/. --media is where the builder looks for the clips the
      # pages name; a missing clip fails the build. --tag is shown on the pages as the release
      # they describe.
      - name: Build the docs pages
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: node tools/build-docs/build.mjs --docs deskbar/docs/features --out site/docs --media site/media --tag "$TAG"

      # Node is already set up by the docs build above; npx below runs html-validate with it.

      # Validate every page in the published folder against .htmlvalidate.json.
      # The version is pinned so a new rule upstream cannot fail an unrelated pull request;
      # bump it on purpose. A non-zero exit fails the job and lists each problem by line.
      - name: Run html-validate
        run: npx --yes html-validate@11.17.0 "site/**/*.html"

  links:
    name: Check links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # ---- Build the feature docs (site/docs/) from the Deskbar repo ----
      # Both check jobs need the built pages in site/docs/, and each job has its own runner, so
      # each builds them. Same steps in pages.yml; keep them in sync.
      # Which Deskbar release the pages describe: its latest GitHub release tag. The token lets gh
      # read the public repo without the anonymous rate limit.
      - name: Find Deskbar's latest release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo AppifySheets/Deskbar --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"

      # Fetch only docs/features at that tag: a shallow, blob-less, sparse clone, so none of the
      # app's source is downloaded.
      - name: Fetch Deskbar's feature docs at that tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git clone --depth 1 --branch "$TAG" --filter=blob:none --sparse https://github.com/AppifySheets/Deskbar deskbar
          git -C deskbar sparse-checkout set docs/features
          # A release that predates the feature docs would otherwise fail later with a confusing
          # "no pages" error; say plainly which tag is missing them.
          test -d deskbar/docs/features || { echo "::error::Deskbar $TAG has no docs/features yet; the feature pages land with Deskbar PR #415"; exit 1; }

      # Node runs the page builder (tools/build-docs). Version matches the html-validate setup.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Install the builder's one dependency (marked) exactly as locked in package-lock.json.
      - name: Install the docs builder
        working-directory: tools/build-docs
        run: npm ci

      # The builder's own tests. They run before the build so a broken builder fails here, with
      # its own message, instead of producing odd pages.
      - name: Test the docs builder
        working-directory: tools/build-docs
        run: npm test

      # Render the markdown into site/docs/. --media is where the builder looks for the clips the
      # pages name; a missing clip fails the build. --tag is shown on the pages as the release
      # they describe.
      - name: Build the docs pages
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: node tools/build-docs/build.mjs --docs deskbar/docs/features --out site/docs --media site/media --tag "$TAG"

      # lychee reads lychee.toml from the repository root: it resolves root-relative links
      # against site/, maps /privacy to privacy.html, checks #fragments, skips deskbar.app
      # itself (not live yet, and not what a pull request should be judged on), and checks
      # every other external link for real.
      #
      # GITHUB_TOKEN lets lychee ask GitHub with a token, which avoids the low anonymous
      # rate limit that would otherwise fail the GitHub links at random.
      #
      # --root-dir has to be an absolute path, which is why it is given here and not in
      # lychee.toml: it is what turns a root-relative link like /css/site.css into a file.
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --root-dir "${{ github.workspace }}/site"
            --no-progress
            "site/**/*.html"
          # Fail the job when a link is broken.
          fail: true
          # Also put the report on the run's summary page, not only in the log.
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
