# Publishes deskbar.app to GitHub Pages.
#
# The pages in site/ are the site, apart from site/docs/, which is built in this workflow.
# This workflow uploads that folder as the Pages artifact and deploys it. Nothing else in
# the repository (README, docs, workflows, checker configs) is published, because only
# site/ goes into the artifact.
#
# When it runs:
#   - on every push to main, which in practice means every merged pull request (main only
#     moves through pull requests, and those have already passed check.yml);
#   - by hand from the Actions tab (Run workflow), to redeploy without a new commit, with
#     an optional Deskbar tag to build the docs from when the latest release breaks them;
#   - daily at 06:17 UTC, so a new Deskbar release reaches the feature docs within a day
#     without a site commit. GitHub turns scheduled runs off after 60 days without
#     activity in the repository; re-enable them from the Actions tab.
#
# site/docs/ is not in the repository: every run builds it from docs/features in the latest
# Deskbar release, or the tag given to a manual run (tools/build-docs). If the fetch or the
# build fails, the run fails and Pages keeps the last deploy. check.yml runs the same build
# daily as well, with the builder's tests and the HTML and link checks this job skips.
#
# Repository settings this relies on (Settings, Pages):
#   - Source: GitHub Actions. Without it the deploy step fails with "Pages not enabled".
#   - Custom domain: deskbar.app. The domain is a repository setting, not a CNAME file in
#     the artifact; Actions-based deploys ignore a CNAME file. docs/hosting.md has the DNS.

name: Publish site

on:
  push:
    branches: [main]
  # Run workflow in the Actions tab: redeploys without a new commit.
  workflow_dispatch:
    inputs:
      # The escape hatch when a Deskbar release breaks the docs build: publish the docs
      # from a tag known to work (e.g. v2.5.95) until the release is fixed. Empty means
      # the latest release, as on every automatic run. The daily run goes back to the
      # latest release, so pin again or fix the release before the next one.
      deskbar_tag:
        description: Deskbar tag to build the docs from (empty means the latest release)
        required: false
        default: ""
  schedule:
    # Daily, at an odd minute to stay off the busy top of the hour.
    - cron: "17 6 * * *"

# The deploy needs to write to Pages and to prove who it is with an OIDC token. It never
# needs to write to the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push queues behind a running deploy instead of cancelling
# it, so a deploy is never cut off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The github-pages environment only accepts deploys from the default branch, so a
    # workflow run on any other branch cannot publish. The URL shows on the run page.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Get main's files, the site as merged.
      - uses: actions/checkout@v7

      # Build site/docs/ from Deskbar's latest release, or from the tag a manual run gives
      # (see the action for the steps and why). test: "false" skips the builder's tests,
      # which fetch html-validate through npx (an unlocked dependency tree) and so should
      # not run in a job holding pages:write and id-token:write. check.yml runs them on
      # every pull request, on main and daily.
      - uses: ./.github/actions/build-docs
        with:
          tag: ${{ inputs.deskbar_tag }}
          test: "false"

      # Reads the repository's Pages settings for the steps below, and fails early if
      # Pages is not set up for this repository (Source: GitHub Actions).
      - uses: actions/configure-pages@v6

      # Packs site/ as the artifact Pages serves. There is no Jekyll step, so the files in
      # site/ are served as they are.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # Publishes the artifact. deploy-pages waits until the new version is live.
      - id: deployment
        uses: actions/deploy-pages@v5
