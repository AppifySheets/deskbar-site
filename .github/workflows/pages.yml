# Publishes deskbar.app to GitHub Pages.
#
# The pages in site/ are the site, apart from site/docs/, which is built in this workflow. This workflow uploads that
# folder as the Pages artifact and deploys it. Nothing else in the repository (README, docs,
# workflows, checker configs) is published, because only site/ goes into the artifact.
#
# When it runs:
#   - on every push to main, which in practice means every merged pull request (main only
#     moves through pull requests, and those have already passed check.yml);
#   - by hand from the Actions tab (Run workflow), to redeploy without a new commit;
#   - daily at 06:17 UTC, so a new Deskbar release reaches the feature docs within a day
#     without a site commit.
#
# site/docs/ is not in the repository: every run builds it from docs/features in the latest
# Deskbar release (tools/build-docs). If the fetch or the build fails, the run fails and
# Pages keeps the last deploy.
#
# Repository settings this relies on (Settings, Pages):
#   - Source: GitHub Actions. Without it the deploy step fails with "Pages not enabled".
#   - Custom domain: deskbar.app. The domain is a repository setting, not a CNAME file in
#     the artifact; Actions-based deploys ignore a CNAME file. docs/hosting.md has the DNS.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily, at an odd minute to stay off the busy top of the hour.
    - cron: "17 6 * * *"

# The deploy needs to write to Pages and to prove who it is with an OIDC token. It never
# needs to write to the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push queues behind a running deploy instead of cancelling
# it, so a deploy is never cut off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The github-pages environment only accepts deploys from the default branch, so a
    # workflow run on any other branch cannot publish. The URL shows on the run page.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # ---- Build the feature docs (site/docs/) from the Deskbar repo ----
      # Runs before the upload so the artifact contains the built pages. A failed fetch or build
      # fails the run, and Pages keeps serving the last successful deploy.
      # Which Deskbar release the pages describe: its latest GitHub release tag. The token lets gh
      # read the public repo without the anonymous rate limit.
      - name: Find Deskbar's latest release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo AppifySheets/Deskbar --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"

      # Fetch only docs/features at that tag: a shallow, blob-less, sparse clone, so none of the
      # app's source is downloaded.
      - name: Fetch Deskbar's feature docs at that tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git clone --depth 1 --branch "$TAG" --filter=blob:none --sparse https://github.com/AppifySheets/Deskbar deskbar
          git -C deskbar sparse-checkout set docs/features
          # A release that predates the feature docs would otherwise fail later with a confusing
          # "no pages" error; say plainly which tag is missing them.
          test -d deskbar/docs/features || { echo "::error::Deskbar $TAG has no docs/features yet; the feature pages land with Deskbar PR #415"; exit 1; }

      # Node runs the page builder (tools/build-docs). Version matches the html-validate setup.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Install the builder's one dependency (marked) exactly as locked in package-lock.json.
      - name: Install the docs builder
        working-directory: tools/build-docs
        run: npm ci

      # The builder's own tests. They run before the build so a broken builder fails here, with
      # its own message, instead of producing odd pages.
      - name: Test the docs builder
        working-directory: tools/build-docs
        run: npm test

      # Render the markdown into site/docs/. --media is where the builder looks for the clips the
      # pages name; a missing clip fails the build. --tag is shown on the pages as the release
      # they describe.
      - name: Build the docs pages
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: node tools/build-docs/build.mjs --docs deskbar/docs/features --out site/docs --media site/media --tag "$TAG"

      # Reads the repository's Pages settings and fails early if Pages is not set up.
      - uses: actions/configure-pages@v6

      # Packs site/ as the artifact Pages serves. There is no Jekyll step, so the files in
      # site/ are served as they are.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # Publishes the artifact. deploy-pages waits until the new version is live.
      - id: deployment
        uses: actions/deploy-pages@v5
